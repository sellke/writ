# Writ ships no Python package. This file exists for two reasons only:
#
#   1. Declare the interpreter floor for the one script that ships
#      (plugins/writ/skills/writ-jev/jev.py) and for scripts/check.py.
#      The floor is the macOS system Python.
#   2. Make the tests runnable with one command that has pytest available:
#
#          uv run --isolated --python 3.9 --with pytest pytest
#
# The product version lives in the VERSION file. PEP 621 forces a `version`
# on any [project] table, so the one below mirrors VERSION; a release updates
# both and the three plugin manifests in the same commit (scripts/check.py
# fails when a manifest disagrees with VERSION). Nothing is published from
# here. `.venv/` and `uv.lock` are gitignored.

[project]
name = "writ-scripts"
version = "1.0.0"
requires-python = ">=3.9"

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
