name: Checks

on:
  pull_request:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skills, manifests, and README hold together
        run: python3 scripts/check.py

      # The steps below use !cancelled() so each one runs and reports even
      # when an earlier step failed.
      - uses: astral-sh/setup-uv@v7
        if: ${{ !cancelled() }}

      - name: pytest on the Python 3.9 floor
        if: ${{ !cancelled() }}
        run: uv run --isolated --python 3.9 --with pytest pytest

      - name: pytest on current Python
        if: ${{ !cancelled() }}
        run: uv run --isolated --python 3.14 --with pytest pytest

      # Count failures and exit non-zero at the end, so one red test does not
      # hide the others.
      - name: bash tests
        if: ${{ !cancelled() }}
        run: |
          fails=0
          for t in scripts/tests/test_*.sh; do
            [ -f "$t" ] || continue
            echo "== $t"
            bash "$t" || { echo "FAIL $t"; fails=$((fails + 1)); }
          done
          echo "bash tests failed: $fails"
          [ "$fails" -eq 0 ]
